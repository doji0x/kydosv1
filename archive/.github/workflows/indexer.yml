name: Index Robinhood Chain

# Keeps Kydos market data fresh without relying on the in-app scheduler.
# Requires one repository secret holding the shared cron secret, under either name:
#   KYDOS_CRON_SECRET  or  RH_CRON_SECRET  - must match the app's RH_CRON_SECRET
# Optional: KYDOS_CYCLE_URL overrides the endpoint below (e.g. a custom domain).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: kydos-indexer
  cancel-in-progress: false

jobs:
  index:
    name: Run one market-data cycle
    runs-on: ubuntu-latest
    steps:
      - name: Trigger indexing cycle
        run: |
          cron_secret="${KYDOS_CRON_SECRET:-$RH_CRON_SECRET}"
          if [ -z "$cron_secret" ]; then
            echo "::error::No cron secret found. Add a repository secret named KYDOS_CRON_SECRET (or RH_CRON_SECRET) matching the app's RH_CRON_SECRET."
            exit 1
          fi
          echo "POST $KYDOS_CYCLE_URL"
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 300 \
            --request POST "$KYDOS_CYCLE_URL" \
            --header "content-type: application/json" \
            --header "x-kydos-cron: $cron_secret" \
            --data '{}')
          echo "$response"
        env:
          KYDOS_CYCLE_URL: ${{ secrets.KYDOS_CYCLE_URL || 'https://kydos-launch-pad.base44.app/functions/runRhCycle' }}
          KYDOS_CRON_SECRET: ${{ secrets.KYDOS_CRON_SECRET }}
          RH_CRON_SECRET: ${{ secrets.RH_CRON_SECRET }}
