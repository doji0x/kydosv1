name: Solana Anchor
on:
  push:
    branches: [astra/latest]
    paths: ['solana/**','src/lib/solana/**','src/lib/SolanaWalletContext.jsx','src/pages/SolanaLaunch.jsx','base44/functions/indexSolanaTransactions/**','base44/functions/solanaRpc/**','base44/entities/SolanaTrade.jsonc','package.json','.github/workflows/solana-scaffold.yml']
  pull_request:
    branches: [main]
    paths: ['solana/**','src/lib/solana/**','src/lib/SolanaWalletContext.jsx','src/pages/SolanaLaunch.jsx','base44/functions/indexSolanaTransactions/**','base44/functions/solanaRpc/**','base44/entities/SolanaTrade.jsonc','package.json','.github/workflows/solana-scaffold.yml']
permissions: {contents: read}
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: dtolnay/rust-toolchain@1.79.0
      - uses: swatinem/rust-cache@v2
        with: {workspaces: solana}
      - uses: metaplex-foundation/actions/install-solana@v1
        with: {version: '2.1.21'}
      - uses: metaplex-foundation/actions/install-anchor@v1
        with: {version: '0.31.1'}
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm --prefix solana run check
      - run: npm --prefix solana test
      - working-directory: solana
        run: anchor build
      - uses: actions/upload-artifact@v4
        with: {name: kydos-anchor-artifacts, path: 'solana/target/{idl,types,deploy}'}
