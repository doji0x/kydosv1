name: DBC SDK and executed lifecycle
on:
  push:
    branches: [codex/meteora-dbc-integration]
    paths: ['solana/dbc/**', '.github/workflows/dbc-integration.yml']
  pull_request:
    paths: ['solana/dbc/**', '.github/workflows/dbc-integration.yml']
permissions:
  contents: read
jobs:
  dbc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: solana/dbc
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0}
      - name: Install only the reviewed locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Execute policy, SDK and confirmation safeguards
        run: |
          set -o pipefail
          npm test 2>&1 | tee sdk-test-results.txt
      - name: Record exact nominal SDK accounting
        run: node inspect.mjs > candidate-report.json
      - name: Install pinned Agave validator
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 60 https://release.anza.xyz/v2.1.21/install -o "$RUNNER_TEMP/agave-install.sh"
          sh "$RUNNER_TEMP/agave-install.sh"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Fetch and verify pinned DBC, DAMM and metadata bytecode
        run: |
          set -euo pipefail
          mkdir -p runtime/fixtures
          base=https://raw.githubusercontent.com/MeteoraAg/dynamic-bonding-curve-sdk/a28b7239e71899eb52ff7aacac4dec90441885c4/packages/dynamic-bonding-curve/tests/fixtures
          while read -r hash name; do
            curl --fail --location --retry 2 --max-time 60 "$base/$name" -o "runtime/fixtures/$name"
            test "$(git hash-object "runtime/fixtures/$name")" = "$hash"
          done <<'PINS'
          7fd83fbd3553fce004fb7af73ec230aa6d0a3360 dynamic_bonding_curve.so
          946562cfc35b978dbaf1100363b7505b018fd6f6 cp_amm.so
          5da6f4fa684bd01fc15a7d20eca754a11d247348 metaplex.so
          PINS
      - name: Execute complete DBC lifecycles on loopback only
        timeout-minutes: 5
        run: |
          set -o pipefail
          mkdir -p runtime-results
          npm run test:runtime 2>&1 | tee runtime-results/test-results.txt
      - name: Verify dependency locks and source were not modified by tests
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dbc-lifecycle-evidence
          retention-days: 7
          path: |
            solana/dbc/candidate-report.json
            solana/dbc/sdk-test-results.txt
            solana/dbc/runtime-results/
