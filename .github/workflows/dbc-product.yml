name: DBC product integration
on:
  push:
    branches: [codex/mainnet-backend-tooling]
    paths: ['.github/workflows/dbc-product.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DENO_DIR: /tmp/kydos-product-deno
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - uses: denoland/setup-deno@v2
        with: {deno-version: '2.9.7'}
      - name: Install current approved locks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix solana/dbc ci --ignore-scripts --no-audit --no-fund
      - name: Verify merged maintained-source baseline
        run: npm run typecheck
      - name: Resolve pinned product SDK and Node declarations
        run: |
          mkdir -p /tmp/kydos-product-inputs
          cp typechecks/deno.lock /tmp/kydos-product-inputs/deno.lock
          printf '{"nodeModulesDir":"none","lock":{"path":"./deno.lock","frozen":false}}\n' > /tmp/kydos-product-inputs/deno.json
          printf '/// <reference types="npm:@types/node@22.19.11" />\n' > /tmp/kydos-product-inputs/product-imports.ts
          printf "import 'npm:@meteora-ag/dynamic-bonding-curve-sdk@1.5.13';\nimport 'npm:@meteora-ag/cp-amm-sdk@1.4.10';\nimport 'npm:bn.js@5.2.1';\nimport {Buffer} from 'node:buffer';\nconst sample:Buffer=Buffer.alloc(1);\n" >> /tmp/kydos-product-inputs/product-imports.ts
          DENO_NO_PACKAGE_JSON=1 deno check --config /tmp/kydos-product-inputs/deno.json /tmp/kydos-product-inputs/product-imports.ts
      - name: Preserve exact public checker inputs
        if: ${{ !cancelled() }}
        run: |
          mkdir -p /tmp/kydos-product-inputs
          git rev-parse HEAD > /tmp/kydos-product-inputs/source-commit.txt
          git archive --format=tar.gz HEAD > /tmp/kydos-product-inputs/source.tar.gz
          cp "$(command -v deno)" /tmp/kydos-product-inputs/deno
          tar -czf /tmp/kydos-product-inputs/deno-cache.tar.gz -C "$DENO_DIR" .
          cd /tmp/kydos-product-inputs && sha256sum *.tar.gz deno deno.lock > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dbc-product-inputs
          retention-days: 2
          path: /tmp/kydos-product-inputs/
