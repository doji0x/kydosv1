name: DBC SDK integration proof
on:
  push:
    branches: [codex/meteora-dbc-integration]
    paths: ['solana/dbc/**', '.github/workflows/dbc-integration.yml']
  pull_request:
    paths: ['solana/dbc/**', '.github/workflows/dbc-integration.yml']
permissions:
  contents: read
jobs:
  runtime-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Verify pinned public program fixtures
        run: |
          set -euo pipefail
          mkdir -p runtime-inputs/fixtures
          base=https://raw.githubusercontent.com/MeteoraAg/dynamic-bonding-curve-sdk/a28b7239e71899eb52ff7aacac4dec90441885c4/packages/dynamic-bonding-curve/tests/fixtures
          while read -r hash name; do
            curl --fail --location --retry 2 --max-time 60 "$base/$name" -o "runtime-inputs/fixtures/$name"
            test "$(git hash-object "runtime-inputs/fixtures/$name")" = "$hash"
          done <<'PINS'
          7fd83fbd3553fce004fb7af73ec230aa6d0a3360 dynamic_bonding_curve.so
          946562cfc35b978dbaf1100363b7505b018fd6f6 cp_amm.so
          5da6f4fa684bd01fc15a7d20eca754a11d247348 metaplex.so
          PINS
          git archive --format=tar.gz HEAD AGENTS.md solana/dbc docs/astra-work-state.json docs/astra-delivery-checkpoint.md docs/dbc-transition.md .github/workflows/dbc-integration.yml > runtime-inputs/source.tar.gz
          git rev-parse HEAD > runtime-inputs/source-commit.txt
          (cd runtime-inputs && sha256sum fixtures/* source.tar.gz > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: dbc-runtime-inputs
          retention-days: 3
          path: runtime-inputs/
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: solana/dbc
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 22.16.0}
      - name: Bootstrap isolated lockfile for review
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - name: Execute policy and actual SDK tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee sdk-test-results.txt
      - name: Capture real SDK configuration and accounting report
        if: ${{ !cancelled() }}
        run: node inspect.mjs > candidate-report.json
      - name: Preserve public dependencies for offline reproduction
        if: ${{ !cancelled() }}
        run: tar -czf sdk-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: dbc-sdk-proof
          retention-days: 3
          path: |
            solana/dbc/package-lock.json
            solana/dbc/candidate-report.json
            solana/dbc/sdk-test-results.txt
            solana/dbc/sdk-dependencies.tar.gz
