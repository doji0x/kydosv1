name: Solana Anchor
on:
  push:
    branches: [astra/latest]
    paths: ['solana/**','src/lib/solana/**','src/lib/SolanaWalletContext.jsx','src/pages/SolanaLaunch.jsx','src/hooks/useLaunchFlow.js','src/hooks/useSolanaChartFeed.js','src/hooks/useMarketTrading.js','src/pages/AdminLaunch.jsx','src/pages/SolanaMarket.jsx','src/pages/Board.jsx','src/components/board/**','src/components/solana/**','base44/functions/launchMetadata/**','base44/shared/launchMetadata.js','base44/functions/indexSolanaTransactions/**','base44/functions/solanaRpc/**','base44/shared/solanaRpc.js','base44/shared/solana*.js','base44/shared/adminLaunch.js','base44/shared/heliusSolanaTrades*','base44/functions/adminLaunchToken/**','base44/functions/solanaTokenChart/**','base44/functions/solanaBoard/**','base44/entities/SolanaIndexState.jsonc','base44/entities/AdminLaunchReceipt.jsonc','base44/entities/SolanaTrade.jsonc','package.json','package-lock.json','.github/workflows/solana-scaffold.yml']
  pull_request:
    branches: [main]
    paths: ['solana/**','src/lib/solana/**','src/lib/SolanaWalletContext.jsx','src/pages/SolanaLaunch.jsx','src/hooks/useLaunchFlow.js','src/hooks/useSolanaChartFeed.js','src/hooks/useMarketTrading.js','src/pages/AdminLaunch.jsx','src/pages/SolanaMarket.jsx','src/pages/Board.jsx','src/components/board/**','src/components/solana/**','base44/functions/launchMetadata/**','base44/shared/launchMetadata.js','base44/functions/indexSolanaTransactions/**','base44/functions/solanaRpc/**','base44/shared/solanaRpc.js','base44/shared/solana*.js','base44/shared/adminLaunch.js','base44/shared/heliusSolanaTrades*','base44/functions/adminLaunchToken/**','base44/functions/solanaTokenChart/**','base44/functions/solanaBoard/**','base44/entities/SolanaIndexState.jsonc','base44/entities/AdminLaunchReceipt.jsonc','base44/entities/SolanaTrade.jsonc','package.json','package-lock.json','.github/workflows/solana-scaffold.yml']
permissions: {contents: read}
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: swatinem/rust-cache@v2
        with: {workspaces: solana}
      - name: Install Solana 2.1.21
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.1.21/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor 0.31.1
        run: |
          cargo install --git https://github.com/coral-xyz/anchor --tag v0.31.1 anchor-cli --locked
          anchor --version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix solana run check
      - run: npm --prefix solana test
      - name: Host curve calculations and AMM interface (no validator or token creation)
        working-directory: solana
        run: cargo test --workspace --lib --locked
      - name: Host account validation and Meteora ABI tests (no validator or deployment)
        working-directory: solana
        run: cargo test -p kydos_launchpad --test account_validation --test meteora_adapter --locked
      - name: Build SBF with locked dependencies
        working-directory: solana
        # Anchor -> cargo build-sbf -> cargo build each consumes a separator.
        # Generate the IDL separately because it invokes cargo test directly.
        run: anchor build --program-name kydos_launchpad --no-idl -- -- --locked
      - name: Generate IDL with locked dependencies
        id: idl
        working-directory: solana
        run: anchor idl build --program-name kydos_launchpad --out target/idl/kydos_launchpad.json --out-ts target/types/kydos_launchpad.ts -- --locked
      - name: Report generated interface additions without changing checked-in IDL
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { Program } from '@coral-xyz/anchor';
          import { Connection } from '@solana/web3.js';
          const old = JSON.parse(readFileSync('src/lib/solana/idl/kydos_launchpad.json'));
          const raw = JSON.parse(readFileSync('solana/target/idl/kydos_launchpad.json'));
          const generated = new Program(raw, {connection:new Connection('http://127.0.0.1:8899')}).idl;
          const delta = { address:generated.address, metadata:generated.metadata, sections:{} };
          for (const group of ['instructions','accounts','events','types','errors']) {
            const previous = new Map((old[group] ?? []).map(i=>[i.name,i]));
            delta.sections[group] = { order:(generated[group] ?? []).map(i=>i.name),
              changed:(generated[group] ?? []).filter(i=>JSON.stringify(previous.get(i.name))!==JSON.stringify(i)) };
          }
          delta.generatedSha256 = createHash('sha256').update(JSON.stringify(generated,null,2)+'\n').digest('hex');
          console.log('GENERATED_IDL_DELTA '+JSON.stringify(delta));
          JS
      - name: Fetch and verify pinned public DAMM runtime fixture
        timeout-minutes: 2
        run: |
          mkdir -p solana/target/runtime-fixtures
          curl --fail --silent --show-error --location --max-time 60 --output solana/target/runtime-fixtures/cp_amm.so https://raw.githubusercontent.com/MeteoraAg/damm-v2-sdk/37cd9e690d7b5fb6182638a21b86e0e1bf636a7e/tests/fixtures/cp_amm.so
          test "$(git hash-object solana/target/runtime-fixtures/cp_amm.so)" = 946562cfc35b978dbaf1100363b7505b018fd6f6
      - name: Execute route installation against a loopback-only validator
        timeout-minutes: 6
        run: node solana/tests/runtime/route-installation.mjs
      - name: Verify browser IDL matches the built program
        if: ${{ !cancelled() && steps.idl.outcome == 'success' }}
        working-directory: solana
        run: node scripts/sync-idl.mjs --check
      - name: Verify build outputs and unchanged lockfile
        working-directory: solana
        run: |
          test -s target/deploy/kydos_launchpad.so
          test -s target/idl/kydos_launchpad.json
          test -s target/types/kydos_launchpad.ts
          git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.idl.outcome == 'success' }}
        with:
          name: kydos-anchor-artifacts
          if-no-files-found: error
          path: |
            solana/target/deploy/kydos_launchpad.so
            solana/target/idl/kydos_launchpad.json
            solana/target/types/kydos_launchpad.ts
